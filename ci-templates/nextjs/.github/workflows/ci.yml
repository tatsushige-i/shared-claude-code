name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # プロジェクトで使用するNode.jsバージョン。EOLに達したら更新する。
  NODE_VERSION: 20

jobs:
  eol-check:
    # draft PR ではスキップ。push / workflow_dispatch では draft が null になるため
    # `== false` ではなく `!= true` で判定する（null != true → 実行）。
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Check Node.js EOL
        run: |
          eol=$(curl -sf https://endoflife.date/api/nodejs/$NODE_VERSION.json | jq -r '.eol')
          today=$(date +%Y-%m-%d)
          echo "Node.js $NODE_VERSION EOL: $eol / Today: $today"
          if [[ "$today" > "$eol" ]]; then
            echo "::error::Node.js $NODE_VERSION has reached EOL ($eol)"
            exit 1
          fi

      - name: Check npm audit
        # セキュリティ要件に応じて --audit-level を調整（low / moderate / high / critical）
        run: npm audit --omit=dev --audit-level=moderate

  lint:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

  test:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run test

  build:
    needs: [lint, test]
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run build
